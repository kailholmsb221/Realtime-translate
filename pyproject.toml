[project]
name = "realtime-translator"
version = "0.1.0"
description = "Локальный синхронный переводчик речи поверх Zoom/Google Meet (ru/en/kk)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

# Зависимости живут в requirements-файлах: у каждого модуля свой
# (см. CLAUDE.md, закон 1), общий requirements.txt подключает их через -r.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "engine",
    "engine.audio_io",
    "engine.contracts",
    "engine.orchestrator",
    "engine.stt",
    "engine.translate",
    "engine.tts",
]

[tool.setuptools.package-data]
"engine.contracts" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ui", "models", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках/комментариях — норма

[tool.ruff.lint.per-file-ignores]
"engine/tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
asyncio_mode = "auto"
markers = [
    "real_models: тест поднимает реальные модели; пропускается без RT_REAL_MODELS=1",
]
filterwarnings = ["error::DeprecationWarning:engine.*"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = "^(ui|models)/"
